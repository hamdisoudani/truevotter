<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #ff4500;
      margin-bottom: 5px;
    }
    
    .subtitle {
      color: #666;
      font-size: 14px;
    }
    
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .stat-card {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }
    
    .stat-number {
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }
    
    .stat-label {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
    
    .upvotes { color: #46d160; }
    .downvotes { color: #ff4500; }
    
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .btn {
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: background-color 0.2s;
    }
    
    .btn-primary {
      background: #ff4500;
      color: white;
    }
    
    .btn-primary:hover {
      background: #e03d00;
    }
    
    .btn-secondary {
      background: #f8f9fa;
      color: #333;
      border: 1px solid #dee2e6;
    }
    
    .btn-secondary:hover {
      background: #e9ecef;
    }
    
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
    }
    
    .status.active {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .status.inactive {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Reddit Vote Tracker</div>
    <div class="subtitle">Track upvotes and downvotes</div>
  </div>
  
  <div class="stats">
    <div class="stat-card">
      <div class="stat-number upvotes" id="upvoteCount">0</div>
      <div class="stat-label">Upvotes Tracked</div>
    </div>
    <div class="stat-card">
      <div class="stat-number downvotes" id="downvoteCount">0</div>
      <div class="stat-label">Downvotes Tracked</div>
    </div>
  </div>
  
  <div class="actions">
    <a href="http://localhost:5173" target="_blank" class="btn btn-primary">
      Open Dashboard
    </a>
    <button class="btn btn-secondary" id="clearData">
      Clear Tracking Data
    </button>
  </div>
  
  <div class="status active" id="status">
    ✓ Extension Active - Vote tracking enabled
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
